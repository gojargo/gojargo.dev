name: Deploy

# Builds gojargo.dev from this repo (site) + gojargo/jargo (docs/) and publishes
# it to GitHub Pages. Runs on push, on demand, and when jargo's docs change
# (jargo's notify-site workflow sends a repository_dispatch "jargo-docs"), and
# daily so the GitHub star count in the header stays current.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [jargo-docs]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out jargo docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gojargo/jargo
          path: jargo
          sparse-checkout: docs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          JARGO_DOCS: ${{ github.workspace }}/jargo/docs
          GITHUB_TOKEN: ${{ github.token }} # star count, without the anonymous rate limit
          # PUBLIC_DEMO_URL: https://demo.gojargo.dev   # enables "Talk live" on /demo/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
