<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jargo social card</title>
    <style>
      @import '@fontsource-variable/inter';
      html, body { margin: 0; background: #0b0d16; color: #e5e7f0; font-family: 'Inter Variable', Inter, sans-serif; -webkit-font-smoothing: antialiased; }
      #card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .copy { position: absolute; left: 88px; top: 96px; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
      h1 { margin: 44px 0 0; font-size: 92px; line-height: 1; letter-spacing: -0.045em; font-weight: 800; }
      h1 span { background: linear-gradient(90deg, #22d3ee, #6366f1 50%, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin: 24px 0 0; font-size: 30px; color: #c2c6d6; }
      .url { position: absolute; right: 88px; top: 112px; font-size: 26px; color: #8b90a7; }
    </style>
  </head>
  <body>
    <div id="card">
      <canvas id="waves"></canvas>
      <div class="copy">
        <div class="brand"><img src="./logo.png" alt="" width="56" height="56" />jargo</div>
        <h1>Voice agents <span>in Go.</span></h1>
        <p>Real-time voice agents for the browser, phone, LiveKit and WhatsApp.</p>
      </div>
      <div class="url">gojargo.dev</div>
    </div>
    <script type="module">
      import { createWaves } from '../../src/lib/waves';
      const canvas = document.getElementById('waves');
      const waves = createWaves(canvas, { offsetY: -0.33, preserveDrawingBuffer: true });
      waves.setSize(canvas.clientWidth * devicePixelRatio, canvas.clientHeight * devicePixelRatio);
      waves.draw({ time: 14, level: 0.55 });
      await document.fonts.ready;
      window.__ready = true;
    </script>
  </body>
</html>
